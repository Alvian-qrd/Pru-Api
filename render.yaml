services:
  - type: web
    name: pru-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pru-api-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  - type: pserv
    name: pru-api-db
    runtime: postgres
    plan: free
    databaseName: pru_api
    user: pru_api
